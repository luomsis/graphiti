services:
  graph:
    profiles: [""]
    build:
      context: .
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthcheck')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres-age:
        condition: service_healthy
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - POSTGRES_AGE_DSN=postgresql://graphiti:graphiti@postgres-age:5432/graphiti
      - POSTGRES_AGE_GRAPH_NAME=graphiti
      - POSTGRES_AGE_EMBEDDING_DIMENSION=${POSTGRES_AGE_EMBEDDING_DIMENSION:-384}
      - PORT=8000
      - db_backend=postgres_age

  postgres-age:
    image: docker-postgres-age:latest
    profiles: [""]
    ports:
      - "${POSTGRES_AGE_PORT:-55432}:5432"
    environment:
      - POSTGRES_USER=graphiti
      - POSTGRES_PASSWORD=graphiti
      - POSTGRES_DB=graphiti
    volumes:
      - postgres_age_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphiti -d graphiti"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  postgres_age_data: